name: weirdnet-build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.WEIRDNET_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Point update checker at this repo
        run: sed -i "s#WEIRDNET_GITHUB_REPO#${{ github.repository }}#" shared/src/commonMain/kotlin/dev/cluvex/zedsecure/data/update/UpdateChecker.kt
      - name: Download engines
        run: bash tools/get-cores.sh android
      - name: Signing key
        env:
          B64: ${{ secrets.WEIRDNET_KEYSTORE_B64 }}
          SP: ${{ secrets.WEIRDNET_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.WEIRDNET_KEY_PASSWORD }}
          KA: ${{ secrets.WEIRDNET_KEY_ALIAS }}
        run: |
          umask 077
          if [ "$HAS_KEY" = "true" ]; then
            printf '%s' "$B64" | base64 -d > release.keystore
          else
            echo "::warning::no WEIRDNET_* secrets: using a throwaway key (updates will not install over other builds)"
            SP=weirdnet123; KP=weirdnet123; KA=tmp
            keytool -genkeypair -keystore release.keystore -storepass $SP -keypass $KP -alias $KA -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WEIRDNET"
          fi
          { echo "storeFile=release.keystore"; echo "storePassword=$SP"; echo "keyPassword=$KP"; echo "keyAlias=$KA"; } > keystore.properties
      - name: Build
        run: ./gradlew --warning-mode all :app:assembleRelease
      - name: Collect
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do cp "$f" "dist/WEIRDNET-$(basename "$f")"; done
          ls -l dist
      - name: Forget the key
        if: always()
        run: rm -f release.keystore keystore.properties
      - uses: actions/upload-artifact@v4
        with: { name: WEIRDNET-apks, path: dist/*, retention-days: 30 }

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip (only if the repo holds a zip instead of the files)
        run: |
          echo "--- files in repo:"; ls -la
          if [ ! -f tools/get-cores.sh ]; then
            ls *.zip 2>/dev/null | sort -V | while IFS= read -r z; do echo "unpacking $z"; 7z x -y "$z" -o. > /dev/null; done
          fi
          echo "--- after unpack:"; ls
          test -f tools/get-cores.sh || { echo "::error::tools/get-cores.sh is missing: upload the project zip to the repo root"; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Download engines
        run: bash tools/get-cores.sh windows
      - name: Build (unsigned)
        run: bash ./gradlew --warning-mode all :desktop:createDistributable :desktop:packageMsi
      - name: Collect
        run: |
          mkdir -p dist
          cd desktop/build/compose/binaries/main/app
          7z a -tzip "$GITHUB_WORKSPACE/dist/WEIRDNET-Windows-portable.zip" WEIRDNET
          cd "$GITHUB_WORKSPACE"
          cp desktop/build/compose/binaries/main/msi/*.msi dist/WEIRDNET-Windows.msi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: WEIRDNET-windows, path: dist/*, retention-days: 30 }
